services:
  postgres:
    image: postgres:17-alpine
    container_name: payment-processing-postgres
    environment:
      POSTGRES_DB: payment_processing
      POSTGRES_USER: payment_app
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_app -d payment_processing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
